name: Pages

# This repository is only the site, so every push here is a site change and
# there is nothing to filter on. It used to live in the core repo, where this
# workflow had to be fenced off with path filters in both directions so that a
# typo on the download page did not trigger a five-target binary build.

on:
  push:
    branches: [main]
  # The changelog is written in the core repo and copied here, so this rebuilds
  # on a timer as well as on a push: a release over there has to reach the site
  # without anyone touching this repository. Six hours — a changelog is not a
  # status page, and `workflow_dispatch` covers the minute after a release.
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  # `contents: write` so the refreshed changelog can be committed back. The
  # sync used to be its own workflow that committed and let the push trigger
  # this one — which never fired: a push made with GITHUB_TOKEN deliberately
  # does not start another workflow run, so the site stayed on old data while
  # the commit landed. One workflow, one deploy path, no cross-triggering.
  contents: write
  pages: write
  id-token: write

# Never cancel a deploy in progress: the half-published state is what visitors
# would be looking at.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile

      # Refresh the copy of the core repo's changelog. Non-fatal on purpose:
      # the committed copy is a perfectly good page, so a network failure or a
      # malformed upstream file must not take the site's deploy down with it.
      # The script refuses to write anything it cannot validate.
      - name: Refresh the changelog
        run: yarn sync:changelog || echo "::warning title=Changelog not refreshed::Kept the committed copy. See the step log."

      - name: Commit it if it moved
        run: |
          set -eu
          if git diff --quiet -- src/data/changelog.json; then
            echo "Changelog unchanged." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/changelog.json
          git commit -m "Changelog'u çekirdek depodan tazele

          Otomatik: kaynak crates/changelog/changelog.json, ve site onun bir
          kopyasını tutuyor. Elle düzenleme — bir sonraki senkron geri alır."
          # Best effort. The deploy below uses the working tree either way, so
          # a rejected push (someone pushed while this ran) costs the commit,
          # not the deploy.
          git push || echo "::warning title=Changelog commit not pushed::Deployed anyway; the next run will retry."
          echo "Changelog refreshed." >> "$GITHUB_STEP_SUMMARY"

      # `astro check` runs the TypeScript compiler over the .astro files and
      # the React island. The five translation dictionaries are typed against
      # the English one, so a key added in one language and forgotten in
      # another fails here rather than leaving a blank space on a live page.
      - run: yarn typecheck

      - run: yarn build

      # Runs the language redirector out of `dist/` in a stub browser and
      # checks where it sends each kind of reader. This exists because the
      # feature once shipped inert: an Astro templating mistake emitted a
      # script that parsed, contained `window.location.replace`, and did
      # nothing at all. The build was green and the HTML looked right, so only
      # executing the built script catches it.
      - run: yarn verify

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deploy
        uses: actions/deploy-pages@v4
